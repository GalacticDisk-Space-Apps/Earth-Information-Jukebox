<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <clipPath id="earth-clip">
      <circle cx="12" cy="16" r="7" />
    </clipPath>
  </defs>

  <!-- Dark navy rounded square base visible on dark and light browser tabs -->
  <rect width="32" height="32" rx="6" fill="#0B1D3A" />

  <!-- Thin light-blue atmosphere ring -->
  <circle cx="12" cy="16" r="7.8" fill="none" stroke="#5EA8FF" stroke-width="0.8" opacity="0.95" />

  <!-- Earth ocean circle -->
  <circle cx="12" cy="16" r="7" fill="#1E5BD8" />

  <!-- Earth landmasses clipped to the ocean sphere -->
  <g clip-path="url(#earth-clip)">
    <!-- Northern / western landmass -->
    <path d="M7 13 C8 10.5, 11 9.5, 13.5 10.5 C15.5 11.5, 14.5 14, 12 14.8 C9.5 15.5, 7.5 14.5, 7 13 Z" fill="#0E9F8A" />
    <!-- Equatorial / eastern landmass -->
    <path d="M11 16.5 C13 15.8, 15.5 16.5, 16.5 18.5 C15.5 21, 13.5 22, 11.5 21.2 C10 20, 10 18, 11 16.5 Z" fill="#0E9F8A" />
    <!-- Upper right archipelago -->
    <path d="M15 11.8 C16.2 11, 18 11.8, 17.5 13.5 C16.5 13.8, 15.2 13, 15 11.8 Z" fill="#0E9F8A" />
  </g>

  <!-- Curved amber sound-wave arcs expanding outward -->
  <path d="M 20.1 10.1 A 10 10 0 0 1 20.1 21.9" fill="none" stroke="#F2A516" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 22.0 7.6 A 13 13 0 0 1 22.0 24.4" fill="none" stroke="#F2A516" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 23.9 5.3 A 16 16 0 0 1 23.9 26.7" fill="none" stroke="#F2A516" stroke-width="1.6" stroke-linecap="round" />
</svg>
